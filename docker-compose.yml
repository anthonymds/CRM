services:

  postgres:
    image: postgres:17
    container_name: crm-postgres
    restart: always

    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - crm_postgres_data:/var/lib/postgresql/data


volumes:
  crm_postgres_data: